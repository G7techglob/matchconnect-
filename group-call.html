<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Group Call - MatchConnect</title>

    <link
        rel="stylesheet"
        href="group-call.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>

<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="group-call-header">

        <div>

            <h3 id="groupCallName">
                Group Call
            </h3>

            <p id="participantCount">
                Connecting...
            </p>

        </div>

    </header>


    <!-- =====================================================
         PARTICIPANT GRID
    ====================================================== -->

    <main
        id="participantsGrid"
        class="participants-grid"
    >

        <!-- Participant video/audio tiles
             are created by group-call.js -->

    </main>


    <!-- =====================================================
         GROUP CALL CONTROLS
    ====================================================== -->

    <div class="group-call-controls">

        <button
            id="groupMuteBtn"
            class="group-call-control"
            type="button"
            title="Mute microphone"
        >

            <i class="fa-solid fa-microphone"></i>

        </button>


        <button
            id="groupCameraBtn"
            class="group-call-control"
            type="button"
            title="Camera"
        >

            <i class="fa-solid fa-video"></i>

        </button>


        <button
            id="groupSwitchCameraBtn"
            class="group-call-control"
            type="button"
            title="Switch camera"
        >

            <i class="fa-solid fa-camera-rotate"></i>

        </button>


        <button
            id="groupEndCallBtn"
            class="group-end-call-btn"
            type="button"
            title="Leave call"
        >

            <i class="fa-solid fa-phone-slash"></i>

        </button>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        type="module"
        src="group-call.js"
    ></script>

</body>

</html>
