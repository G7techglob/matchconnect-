<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Group Video Call - MatchConnect</title>

    <link
        rel="stylesheet"
        href="group-video-call.css"
    >

</head>

<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="call-header">

        <button
            id="backBtn"
            class="back-btn"
        >
            ←
        </button>

        <div class="group-info">

            <img
                id="groupPhoto"
                src="images/default-avatar.png"
                alt="Group"
            >

            <div>

                <h2 id="groupName">
                    Group
                </h2>

                <p id="callStatus">
                    Connecting...
                </p>

            </div>

        </div>

    </header>


    <!-- =========================================
         CONNECTION MESSAGE
    ========================================== -->

    <div
        id="connectionMessage"
        class="connection-message"
    >
        Connecting...
    </div>


    <!-- =========================================
         VIDEO AREA
    ========================================== -->

    <main
        id="videoContainer"
        class="video-container"
    >

        <!-- LOCAL VIDEO -->

        <div
            id="localVideoBox"
            class="video-box local-video-box"
        >

            <video
                id="localVideo"
                autoplay
                muted
                playsinline
            ></video>

            <div class="video-name">
                You
            </div>

        </div>


        <!-- REMOTE VIDEOS WILL BE ADDED HERE -->

    </main>


    <!-- =========================================
         PARTICIPANTS
    ========================================== -->

    <section
        id="participants"
        class="participants"
    >
    </section>


    <!-- =========================================
         CONTROLS
    ========================================== -->

    <div class="call-controls">

        <button
            id="muteBtn"
            class="call-control"
        >

            <span id="muteIcon">
                🎤
            </span>

            <span id="muteText">
                Mute
            </span>

        </button>


        <button
            id="cameraBtn"
            class="call-control"
        >

            <span id="cameraIcon">
                📹
            </span>

            <span id="cameraText">
                Camera
            </span>

        </button>


        <button
            id="speakerBtn"
            class="call-control"
        >

            🔊

            <span>
                Speaker
            </span>

        </button>


        <button
            id="leaveBtn"
            class="call-control leave-btn"
        >

            📞

            <span>
                Leave
            </span>

        </button>

    </div>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script
        type="module"
        src="group-video-call.js"
    ></script>

</body>

       </html>
