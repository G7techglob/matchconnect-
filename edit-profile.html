<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - MatchConnect</title>
    <link rel="stylesheet" href="edit-profile.css">
</head>
<body>
    <header class="header">
    <button class="back-btn">←</button>

    <h2>Edit Profile</h2>

    <button class="save-btn">Save</button>
    </header>
<section class="profile-photo">

    <img src="images/default-profile.png" alt="Profile Photo">

    <button>Change Photo</button>

</section>

<form>

<input type="text" id="fullName" placeholder="Enter your full name">

<input type="text" id="username" placeholder="Username">

<textarea id="bio" placeholder="Tell people about yourself"></textarea>

<input type="email" id="email" placeholder="Email">

<input type="tel" id="phone" placeholder="Phone Number">

<input type="text" id="country" placeholder="Country">

<input type="text" id="city" placeholder="City">

</form>

<button class="save-profile" id="saveProfile">
    Save Changes
</button>
    
    <script type="module" src="edit-profile.js"></script>
</body>
</html>
