<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
<link rel="stylesheet" href="profile.css">

</head>
<body class="profile-page">

<div class="profile-box">

  <h2>My Profile</h2>

  <img
    id="profilePhoto"
    src="images/default-avatar.png"
    width="120"
  >

  <h3 id="profileName">
    Loading...
  </h3>

  <p id="profileEmail">
    Loading...
  </p>

  <p id="profileBio">
    No bio yet
  </p>
  
<a href="edit-profile.html" class="edit-profile-btn">
    ✏️ Edit Profile
</a>
<div id="profileStats">


  <p>
    Posts:
    <span id="postCount">0</span>
  </p>

</div>
  
  <input
  type="text"
  id="editName"
  placeholder="Enter username"
>

<textarea
  id="editBio"
  placeholder="Write your bio">
</textarea>
  <input
  type="text"
  id="photoURLInput"
  placeholder="Paste photo URL"
>

<button id="saveProfileBtn">
  Save Profile
</button>

<h3>
  <a id="followersLink" href="#">
    Followers:
    <span id="followersCount">0</span>
  </a>
</h3>

<h3>
  <a id="followingLink" href="#">
    Following:
    <span id="followingCount">0</span>
  </a>
</h3>

  
<h3>Create Post</h3>

<textarea
  id="profilePostContent"
  placeholder="What's on your mind?">
</textarea>

<button id="profilePostBtn">
  Post
</button>

<h3>My Posts</h3>

<div id="myPosts"></div>

</div>

  <div id="navbar-container"></div>
  
<script type="module" src="profile.js"></script>

  <script src="navbar.js"></script>
  
  
</body>
</html>
