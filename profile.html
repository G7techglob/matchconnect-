<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile</title>

  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="profile.css" />
  <link rel="stylesheet" href="navbar.css" />
</head>
<body class="profile-page">
  <main class="profile-box" role="main" aria-labelledby="profilePageTitle">
    <header class="profile-header">
      <h1 id="profilePageTitle">My Profile</h1>

      <div class="header-actions" aria-label="Profile actions">
        
        <a href="edit-profile.html" class="edit-profile-btn" aria-label="Edit your profile">
        Edit Profile
        </a>

      </div>
    </header>

    <section class="profile-info" aria-label="Profile information">  <div class="profile-main-row"><div class="follow-side follow-left">
  <a id="followersLink" href="#" aria-label="View followers list">
    <span class="follow-label">Followers</span>
    <span id="followersCount" aria-live="polite">0</span>
  </a>
</div>

<img
  id="profilePhoto"
  src="images/default-avatar.png"
  alt="User profile photo"
  width="120"
  height="120"
  loading="lazy"
/>

<div class="follow-side follow-right">
  <a id="followingLink" href="#" aria-label="View following list">
    <span class="follow-label">Following</span>
    <span id="followingCount" aria-live="polite">0</span>
  </a>
</div>

  </div>  <h2 id="profileName">Loading...</h2>
  <p id="profileEmail">Loading...</p>
  <p id="profileBio">No bio yet</p></section>

    <section id="profileStats" aria-label="Profile statistics">
      <p>
        Posts:
        <span id="postCount" aria-live="polite">0</span>
      </p>
    </section>

    <section class="profile-tabs">

  <button id="postsTab">
    Posts
  </button>

  <button id="photosTab">
    Photos
  </button>

  <button id="reelsTab">
    Reels
  </button>

</section>


<section id="mediaContainer"></section>

    <!-- Photo / Video Post Button -->

<section class="create-post" aria-labelledby="createPostTitle">

  <h3 id="createPostTitle">Create Post</h3>

  <div class="post-content-area">

    <label for="profilePostContent" class="sr-only">
      Write your post
    </label>

    <textarea
      id="profilePostContent"
      placeholder="What's on your mind?"
      rows="4"
      maxlength="500"
    ></textarea>

    <button
      id="createPostBtn"
      class="create-post-btn"
      type="button"
      aria-label="Select photos or videos"
    >🔘</button>

  </div>

  <input
    type="file"
    id="mediaPostInput"
    accept="image/*,video/*"
    multiple
    hidden
  >

  <button id="profilePostBtn" type="button">
    Post
  </button>

</section>
    

    <section class="my-posts" aria-labelledby="myPostsTitle">
      <h3 id="myPostsTitle">My Posts</h3>
      <div id="myPosts" aria-live="polite"></div>
    </section>
    
  </main>

  <div id="navbar-container" aria-label="Bottom navigation"></div>

<script type="module" src="profile.js"></script>
  <script type="module" src="navbar.js"></script>
  <script type="module" src="theme.js"></script>
</body>
</html>
