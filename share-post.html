<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Share Post</title>

<link rel="stylesheet" href="share-post.css">

<!-- Font Awesome -->
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
>

</head><body><!-- Background Overlay -->
<div class="overlay" id="overlay"></div>

<!-- Share Bottom Sheet -->
<div class="share-sheet" id="shareSheet">

    <!-- Handle -->
    <div class="sheet-handle"></div>

    <!-- Header -->
    <div class="sheet-header">
        <h2>Share Post</h2>
    </div>


    <!-- ========================= -->
    <!-- Share Outside MatchConnect -->
    <!-- ========================= -->

    <div class="section-title">
        Share Outside MatchConnect
    </div>

    <button class="share-option" id="whatsappBtn" type="button">
        <i class="fab fa-whatsapp"></i>
        <span>Share to WhatsApp</span>
    </button>

    <button class="share-option" id="facebookBtn" type="button">
        <i class="fab fa-facebook"></i>
        <span>Share to Facebook</span>
    </button>

    <button class="share-option" id="telegramBtn" type="button">
        <i class="fab fa-telegram"></i>
        <span>Share to Telegram</span>
    </button>

    <button class="share-option" id="messengerBtn" type="button">
        <i class="fab fa-facebook-messenger"></i>
        <span>Share to Messenger</span>
    </button>

    <button class="share-option" id="emailBtn" type="button">
        <i class="fas fa-envelope"></i>
        <span>Share by Email</span>
    </button>


    <hr>


    <!-- ========================= -->
    <!-- Share Inside MatchConnect -->
    <!-- ========================= -->

    <div class="section-title">
        Share Inside MatchConnect
    </div>

    <button class="share-option" id="groupBtn" type="button">
        <i class="fas fa-users"></i>
        <span>Share to MatchConnect Group</span>
    </button>

    <button class="share-option" id="chatBtn" type="button">
        <i class="fas fa-comments"></i>
        <span>Send to MatchConnect Chat</span>
    </button>

    <button class="share-option" id="repostBtn" type="button">
        <i class="fas fa-retweet"></i>
        <span>Repost</span>
    </button>


    <hr>


    <!-- ========================= -->
    <!-- Copy -->
    <!-- ========================= -->

    <div class="section-title">
        Copy
    </div>

    <button class="share-option" id="copyLinkBtn" type="button">
        <i class="fas fa-link"></i>
        <span>Copy Link</span>
    </button>


    <hr>


    <!-- ========================= -->
    <!-- Cancel -->
    <!-- ========================= -->

    <button class="cancel-btn" id="cancelBtn" type="button">
        Cancel
    </button>

</div>


<script type="module" src="share-post.js"></script>

</body>
</html>
