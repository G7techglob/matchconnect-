<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Chat - MatchConnect</title>

    <link rel="stylesheet" href="group-chat.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <!-- Header -->
    <div class="chat-header">

        <button class="back-btn" onclick="history.back()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <div class="group-info">

    <img
        id="groupPhoto"
        src="images/default-avatar.png"
        class="group-photo">

    <div>
        <h3 id="groupName">Loading...</h3>
        <p>Group Chat</p>
    </div>

</div>


<button id="voiceCallBtn" title="Voice Call">
    <i class="fa-solid fa-phone"></i>
</button>

<button id="videoCallBtn" title="Video Call">
    <i class="fa-solid fa-video"></i>
</button>

<button id="groupMenuBtn" title="Menu">
    <i class="fa-solid fa-ellipsis-vertical"></i>
</button>
        

    </div>

    <!-- Messages -->
    <div id="messages" class="messages"></div>

    <!-- Message Box -->
<div class="message-box">

    <button id="imageBtn" title="Image">
        <i class="fa-solid fa-image"></i>
    </button>

    <button id="cameraBtn" title="Camera">
        <i class="fa-solid fa-camera"></i>
    </button>

    <button id="recordBtn" title="Voice">
        <i class="fa-solid fa-microphone"></i>
    </button>

    <input
        type="text"
        id="messageInput"
        placeholder="Type a message...">

    <button id="sendBtn">
        <i class="fa-solid fa-paper-plane"></i>
    </button>

</div>

<!-- Hidden file inputs -->
<input
    type="file"
    id="imageInput"
    accept="image/*"
    hidden>

<input
    type="file"
    id="videoInput"
    accept="video/*"
    hidden>

<input
    type="file"
    id="cameraInput"
    accept="image/*"
    capture="environment"
    hidden>

    <script type="module" src="group-chat.js"></script>

</body>
</html>
