<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Settings</title>

<link rel="stylesheet" href="chat-settings.css">
</head>
<body>

<header>
    <button onclick="history.back()">←</button>
    <h2>Chat Settings</h2>
</header>

<button id="createGroupBtn">
    Create Group
</button>
    
<div class="settings">

<div class="item">
<label>Read Receipts</label>
<input type="checkbox" id="readReceipts">
</div>

<div class="item">
<label>Typing Indicator</label>
<input type="checkbox" id="typingIndicator">
</div>

<div class="item">
<label>Online Status</label>
<input type="checkbox" id="onlineStatus">
</div>

<div class="item">
<label>Message Preview</label>
<input type="checkbox" id="messagePreview">
</div>

<div class="item">
<label>Auto Download Media</label>
<input type="checkbox" id="autoDownload">
</div>

    <div class="item">
<label>Chat Notifications</label>
<input type="checkbox" id="chatNotifications">
</div>

<div class="item">
<label>Notification Sound</label>
<input type="checkbox" id="notificationSound">
</div>

<div class="item">
<label>Vibration</label>
<input type="checkbox" id="vibration">
</div>

<div class="item">
<label>Dark Mode</label>
<input type="checkbox" id="darkMode">
</div>

<div class="item">
<label>Archive Chats</label>
<button id="archiveChatsBtn">
Manage
</button>
</div>

<div class="item">
<label>Blocked Users</label>
<button id="blockedUsersBtn">
Open
</button>
</div>

    
<button id="saveBtn">Save Settings</button>

</div>

<script type="module" src="chat-settings.js"></script>
<script type="module" src="theme.js"></script>
</body>
</html>
