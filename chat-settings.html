<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Settings - MatchConnect</title>

    <link rel="stylesheet" href="css/chat-settings.css">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

<div class="settings-container">

    <header class="settings-header">

        <button id="backBtn" class="icon-btn">
            <span class="material-icons">arrow_back</span>
        </button>

        <h2>Chat Settings</h2>

        <div style="width:40px;"></div>

    </header>

    <div class="settings-group">

        <h4>Messaging</h4>

        <div class="setting-item">
            <span class="material-icons">done_all</span>
            <span>Read Receipts</span>
        </div>

        <div class="setting-item">
            <span class="material-icons">edit</span>
            <span>Typing Indicator</span>
        </div>

        <div class="setting-item">
            <span class="material-icons">circle</span>
            <span>Online Status</span>
        </div>

        <div class="setting-item">
            <span class="material-icons">download</span>
            <span>Auto-download Media</span>
        </div>

    </div>

</div>

<script type="module" src="js/chat-settings.js"></script>

</body>
</html>
