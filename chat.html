<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        max-width: 700px;
        margin: 0 auto;
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
    }

    .chat-container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
        height: 80vh;
        max-height: 600px;
    }

    .chat-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        border-radius: 12px 12px 0 0;
        text-align: center;
    }

    .chat-header h2 {
        font-size: 18px;
        font-weight: 600;
    }

    #messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        background-color: #f9f9f9;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .message {
        padding: 12px 15px;
        border-radius: 8px;
        background-color: #e8f1ff;
        border-left: 4px solid #667eea;
        word-wrap: break-word;
    }

    .message-user {
        font-weight: 600;
        color: #667eea;
        margin-bottom: 5px;
    }

    .message-time {
        font-size: 12px;
        color: #999;
        margin-left: 10px;
    }

    .message-text {
        color: #333;
        line-height: 1.4;
    }

    .chat-footer {
        padding: 15px;
        background: white;
        border-top: 1px solid #e0e0e0;
        border-radius: 0 0 12px 12px;
        display: flex;
        gap: 10px;
    }

    #messageInput {
        flex: 1;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        font-family: inherit;
        transition: border-color 0.3s;
    }

    #messageInput:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    #sendBtn {
        padding: 12px 25px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    #sendBtn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    #sendBtn:active {
        transform: translateY(0);
    }

    #sendBtn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .error-message {
        background-color: #ffebee;
        color: #c62828;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 10px;
        border-left: 4px solid #c62828;
    }

    .loading-spinner {
        text-align: center;
        color: #999;
        font-size: 14px;
    }

    /* Scrollbar styling */
    #messages::-webkit-scrollbar {
        width: 6px;
    }

    #messages::-webkit-scrollbar-track {
        background: #f1f1f1;
    }

    #messages::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 3px;
    }

    #messages::-webkit-scrollbar-thumb:hover {
        background: #555;
    }
</style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h2 id="chatUserName">Loading...</h2>
    </div>
    
    <div id="messages">
        <div class="loading-spinner">Loading messages...</div>
    </div>
    
    <div class="chat-footer">
        <input
            type="text"
            id="messageInput"
            placeholder="Write a message... (Press Enter to send)"
            autocomplete="off"
        >
        <button id="sendBtn">Send</button>
    </div>
</div>

<script type="module" src="chat.js"></script>

</body>
</html>
