 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h2 id="chatUserName">Loading...</h2>
    </div>
    
    <div id="messages">
        <div class="loading-spinner">Loading messages...</div>
    </div>
    
    <div class="chat-footer">
        <input
            type="text"
            id="messageInput"
            placeholder="Write a message... (Press Enter to send)"
            autocomplete="off"
        >
        <button id="sendBtn">Send</button>
     <button id="callBtn">📞 Call</button>
        <button id="recordBtn">🎙️</button>
<audio id="audioPreview" controls style="display:none;"></audio>
    </div>
</div>

 <div id="callScreen" class="call-screen hidden">
    
    <h2 id="callStatus">Calling...</h2>

    <video id="localVideo" autoplay muted></video>
    <video id="remoteVideo" autoplay></video>

    <div class="call-controls">
        <button id="endCallBtn">❌ End</button>
    </div>
 </div>
    
<script type="module" src="chat.js"></script>
    
</body>
</html>
