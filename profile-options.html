<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Options</title>

    <link rel="stylesheet" href="profile-options.css">

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

<!-- Three dots button -->
<button id="menuBtn" class="menu-btn">
    <span class="material-icons">more_vert</span>
</button>

<!-- Popup Menu -->
<div id="menu" class="menu">

    <button class="menu-item" id="shareBtn">
        <span class="material-icons">share</span>
        Share Profile
    </button>

    <button class="menu-item" id="blockBtn">
        <span class="material-icons">block</span>
        Block User
    </button>

    <button class="menu-item report" id="reportBtn">
        <span class="material-icons">flag</span>
        Report User
    </button>

</div>

<script src="profile-options.js"></script>

</body>
</html>
