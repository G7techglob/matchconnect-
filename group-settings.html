<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Group Settings - MatchConnect</title>

<link rel="stylesheet" href="group-settings.css">

</head>

<body>


<header class="settings-header">

<button onclick="history.back()">
←
</button>

<h2>Group Settings</h2>

</header>



<section class="group-profile">

<img 
id="groupPhoto"
src="images/default-avatar.png">


<h2 id="groupName">
Loading...
</h2>

</section>



<div class="settings-menu">

    <!-- Notifications -->
    <button id="muteGroupBtn">
        <i class="fa-solid fa-bell-slash"></i>
        <span id="muteGroupText">Mute Notifications</span>
    </button>

    <!-- Pin -->
    <button id="pinGroupBtn">
        <i class="fa-solid fa-thumbtack"></i>
        <span id="pinGroupText">Pin Group</span>
    </button>

    <!-- Group Members -->
    <button id="addMembersBtn">
        <i class="fa-solid fa-user-plus"></i>
        <span>Add Members</span>
    </button>


 <button id="joinGroupBtn">
    <i class="fa-solid fa-right-to-bracket"></i>
    <span>Join Group</span>
 </button>
 
    <button id="viewMembersBtn">
        <i class="fa-solid fa-users"></i>
        <span>View Members</span>
    </button>

    <!-- Group Information -->
    <button id="changeNameBtn">
        <i class="fa-solid fa-pen"></i>
        <span>Change Group Name</span>
    </button>

    <button id="changePhotoBtn">
        <i class="fa-solid fa-camera"></i>
        <span>Change Group Photo</span>
    </button>

    <!-- Chat -->
    <button id="clearGroupBtn">
        <i class="fa-solid fa-broom"></i>
        <span>Clear Group Chat</span>
    </button>

    <!-- Report -->
    <button id="reportGroupBtn">
        <i class="fa-solid fa-flag"></i>
        <span>Report Group</span>
    </button>

    <!-- Leave -->
    <button id="leaveGroupBtn" class="danger">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Leave Group</span>
    </button>

</div>
 



<div id="membersList">

</div>

<input
    type="file"
    id="groupPhotoInput"
    accept="image/*"
    hidden>

<script type="module" src="group-settings.js"></script>


</body>

</html>
