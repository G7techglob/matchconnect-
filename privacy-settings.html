<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Privacy Settings - MatchConnect</title>

    <link rel="stylesheet" href="privacy-settings.css">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>

<body>


<div class="container">


    <!-- Header -->

    <header class="header">

        <button id="backBtn" class="icon-btn">
            <span class="material-icons">
                arrow_back
            </span>
        </button>


        <h2>
            Privacy Settings
        </h2>


        <div style="width:40px;"></div>

    </header>




    <!-- Privacy Options -->

    <div class="card">


        <div class="privacy-item">

            <div>
                <span class="title">
                    Profile Visibility
                </span>

                <p>
                    Allow others to view your profile
                </p>
            </div>


            <label class="switch">

                <input type="checkbox" id="profileVisibility" checked>

                <span class="slider"></span>

            </label>

        </div>




        <div class="privacy-item">

            <div>
                <span class="title">
                    Show Online Status
                </span>

                <p>
                    Let people know when you are online
                </p>
            </div>


            <label class="switch">

                <input type="checkbox" id="onlineStatus" checked>

                <span class="slider"></span>

            </label>

        </div>





        <div class="privacy-item">

            <div>
                <span class="title">
                    Allow Messages
                </span>

                <p>
                    Receive messages from other users
                </p>
            </div>


            <label class="switch">

                <input type="checkbox" id="allowMessages" checked>

                <span class="slider"></span>

            </label>

        </div>


    </div>



</div>



<script type="module" src="privacy-settings.js"></script>


</body>
</html>
