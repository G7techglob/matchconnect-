<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chats - MatchConnect</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="chats.css" />

    <style>
        :root {
            --bg: #f6f7fb;
            --surface: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --line: #e5e7eb;
            --primary: #2563eb;
            --primary-soft: #dbeafe;
            --danger: #ef4444;
            --header-h: 64px;
            --nav-h: 74px;
            --radius: 14px;
            --shadow: 0 6px 24px rgba(17, 24, 39, 0.06);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
            background: var(--bg);
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            position: sticky;
            top: 0;
            z-index: 20;
            height: var(--header-h);
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 10px;
            padding: 0 14px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(6px);
            border-bottom: 1px solid var(--line);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #fff;
            color: var(--text);
            cursor: pointer;
        }

        .back-btn:focus-visible,
        .chat-search input:focus-visible,
        .chat-item:focus-visible {
            outline: 3px solid var(--primary-soft);
            outline-offset: 2px;
        }

        .chat-header h1 {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.2px;
        }

        .header-spacer {
            width: 40px;
            height: 40px;
        }

        .chat-page {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 12px;
            padding-bottom: calc(var(--nav-h) + 18px);
        }

        .chat-search-wrap {
            position: sticky;
            top: calc(var(--header-h) + 2px);
            z-index: 15;
            padding: 8px 0 10px;
            background: linear-gradient(var(--bg), var(--bg));
        }

        .chat-search {
            position: relative;
            width: 100%;
        }

        .chat-search i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 0.95rem;
            pointer-events: none;
        }

        .chat-search input {
            width: 100%;
            height: 46px;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 0 12px 0 36px;
            font-size: 0.98rem;
            background: var(--surface);
            color: var(--text);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .chat-list {
            display: grid;
            gap: 10px;
        }

        .chat-item {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 12px;
            width: 100%;
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: var(--radius);
            padding: 12px;
            text-align: left;
            box-shadow: var(--shadow);
            cursor: pointer;
        }

        .avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
            background: #eef2ff;
            border: 1px solid #e0e7ff;
        }

        .chat-main {
            min-width: 0;
        }

        .chat-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 4px;
        }

        .chat-name {
            margin: 0;
            font-size: 0.98rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-time {
            margin: 0;
            font-size: 0.74rem;
            color: var(--muted);
            flex-shrink: 0;
        }

        .chat-message {
            margin: 0;
            font-size: 0.9rem;
            color: #374151;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            min-width: 22px;
            height: 22px;
            border-radius: 999px;
            padding: 0 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.74rem;
            font-weight: 700;
            color: #fff;
            background: var(--danger);
        }

        .empty-state {
            border: 1px dashed #cbd5e1;
            border-radius: var(--radius);
            background: #fff;
            padding: 22px;
            text-align: center;
            color: var(--muted);
            margin-top: 6px;
        }

        #navbar-container {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 30;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            border-top: 1px solid var(--line);
            padding-bottom: max(0px, env(safe-area-inset-bottom));
        }

        #navbar-container nav,
        #navbar-container .navbar,
        #navbar-container .bottom-nav,
        #navbar-container ul {
            max-width: 900px;
            margin: 0 auto;
        }

        #navbar-container a,
        #navbar-container button,
        #navbar-container i,
        #navbar-container svg {
            font-size: clamp(1rem, 2.3vw, 1.2rem);
        }

        @media (min-width: 768px) {
            .chat-page {
                padding: 18px;
                padding-bottom: calc(var(--nav-h) + 26px);
            }

            .chat-header {
                padding: 0 18px;
            }

            .chat-name {
                font-size: 1rem;
            }

            .chat-message {
                font-size: 0.93rem;
            }
        }
    </style>
</head>

<body>
    <header class="chat-header" role="banner">
        <button
            class="back-btn"
            type="button"
            onclick="history.back()"
            aria-label="Go back"
            title="Back"
        >
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        </button>

        <h1>Chats</h1>
        <span class="header-spacer" aria-hidden="true"></span>
    </header>

    <main class="chat-page" id="mainContent" role="main">
        <section class="chat-search-wrap" aria-label="Search chats">
            <label class="sr-only" for="chatSearch">Search chats</label>
            <div class="chat-search">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input
                    id="chatSearch"
                    type="search"
                    placeholder="Search chats"
                    autocomplete="off"
                />
            </div>
        </section>

        <section aria-label="Conversations">
            <div id="chatList" class="chat-list" role="list" aria-live="polite">
                <!-- All conversations will appear here -->
                <!-- Sample fallback card(s) visible if JS has not rendered items yet -->
                <button class="chat-item" type="button" role="listitem" aria-label="Open chat with Alex, 2 unread messages">
                    <img class="avatar" src="https://via.placeholder.com/46" alt="Alex profile picture" />
                    <div class="chat-main">
                        <div class="chat-top">
                            <p class="chat-name">Alex Johnson</p>
                            <p class="chat-time">2m</p>
                        </div>
                        <p class="chat-message">Hey! Are we still on for later?</p>
                    </div>
                    <span class="badge" aria-label="2 unread messages">2</span>
                </button>

                <button class="chat-item" type="button" role="listitem" aria-label="Open chat with Sam, no unread messages">
                    <img class="avatar" src="https://via.placeholder.com/46" alt="Sam profile picture" />
                    <div class="chat-main">
                        <div class="chat-top">
                            <p class="chat-name">Sam Patel</p>
                            <p class="chat-time">Yesterday</p>
                        </div>
                        <p class="chat-message">Thanks for the update 👍</p>
                    </div>
                </button>
            </div>

            <div class="empty-state" id="chatEmptyState" hidden>
                No chats found. Try another search term.
            </div>
        </section>
    </main>

    <div id="navbar-container" aria-label="Bottom navigation"></div>

    <script src="navbar.js"></script>
    <script type="module" src="chats.js"></script>

    <script>
        (function () {
            const searchInput = document.getElementById('chatSearch');
            const chatList = document.getElementById('chatList');
            const emptyState = document.getElementById('chatEmptyState');

            if (!searchInput || !chatList || !emptyState) return;

            const getItems = () => Array.from(chatList.querySelectorAll('.chat-item'));

            const applyFilter = () => {
                const q = searchInput.value.trim().toLowerCase();
                const items = getItems();
                let visibleCount = 0;

                items.forEach((item) => {
                    const name = item.querySelector('.chat-name')?.textContent?.toLowerCase() || '';
                    const msg = item.querySelector('.chat-message')?.textContent?.toLowerCase() || '';
                    const visible = !q || name.includes(q) || msg.includes(q);
                    item.hidden = !visible;
                    if (visible) visibleCount++;
                });

                emptyState.hidden = visibleCount !== 0;
            };

            searchInput.addEventListener('input', applyFilter);
            applyFilter();
        })();
    </script>
</body>
</html>
