<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chats - MatchConnect</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="chats.css" />
    
    <link rel="stylesheet" href="navbar.css" />
    

</head>

<body>
    <header class="chat-header" role="banner">
        <button
            class="back-btn"
            type="button"
            onclick="history.back()"
            aria-label="Go back"
            title="Back"
        >
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        </button>

        <h1>Chats</h1>
        <span class="header-spacer" aria-hidden="true"></span>
        <section class="chat-search-wrap" aria-label="Search chats">
            <label class="sr-only" for="chatSearch">Search chats</label>
            <div class="chat-search">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input
                    id="chatSearch"
                    type="search"
                    placeholder="Search chats"
                    autocomplete="off"
                />
            </div>
        </section>
        <button id="chatSettingsBtn">
    ⚙️
        </button>
    </header>

    <main class="chat-page" id="mainContent" role="main">
        

        <section aria-label="Conversations">
            <div id="chatList" class="chat-list" role="list" aria-live="polite">
                <h3>Groups</h3>

               <div id="groupsList"></div>
                <!-- All conversations will appear here -->
                <!-- Sample fallback card(s) visible if JS has not rendered items yet -->
                <button class="chat-item" type="button" role="listitem" aria-label="Open chat with Alex, 2 unread messages">
                    <img class="avatar" src="https://via.placeholder.com/46" alt="Alex profile picture" />
                    <div class="chat-main">
                        <div class="chat-top">
                            <p class="chat-name">Alex Johnson</p>
                            <p class="chat-time">2m</p>
                        </div>
                        <p class="chat-message">Hey! Are we still on for later?</p>
                    </div>
                    <span class="badge" aria-label="2 unread messages">2</span>
                </button>

                <button class="chat-item" type="button" role="listitem" aria-label="Open chat with Sam, no unread messages">
                    <img class="avatar" src="https://via.placeholder.com/46" alt="Sam profile picture" />
                    <div class="chat-main">
                        <div class="chat-top">
                            <p class="chat-name">Sam Patel</p>
                            <p class="chat-time">Yesterday</p>
                        </div>
                        <p class="chat-message">Thanks for the update 👍</p>
                    </div>
                </button>
            </div>

            <div class="empty-state" id="chatEmptyState" hidden>
                No chats found. Try another search term.
            </div>
        </section>
    </main>

    <div id="navbar-container" aria-label="Bottom navigation"></div>

    <script src="navbar.js"></script>
    <script type="module" src="chats.js"></script>

    
</body>
</html>
