<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<title>User Profile</title>
  
    <link rel="stylesheet" href="user.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="user-page">

<div class="profile-container">
  <h2>User Profile</h2>
  <button id="menuBtn" class="menu-btn" type="button" aria-label="Open profile menu" aria-controls="profileMenu" aria-expanded="false">
          <i class="fa-solid fa-ellipsis-vertical" aria-hidden="true"></i>
  </button>

  <!-- Profile Menu -->
    <section id="profileMenu" class="profile-menu" aria-label="Profile menu">
      <button id="shareProfile" type="button">
        <i class="fa-solid fa-share" aria-hidden="true"></i>
        <span>Share Profile</span>
      </button>

      <button id="blockUser" type="button">
        <i class="fa-solid fa-ban" aria-hidden="true"></i>
        <span>Block User</span>
      </button>

      <button id="reportUser" class="danger" type="button">
        <i class="fa-solid fa-flag" aria-hidden="true"></i>
        <span>Report User</span>
      </button>
    </section>

    <section class="profile-info" aria-label="Profile information">
    

  <img
    id="userPhoto"
    src="images/default-avatar.png"
    width="120"
    alt="User Profile Picture"
  >

  <h3 id="userName">
    Loading...
  </h3>

  <button id="followBtn">
    Follow
  </button>

  <button id="messageBtn">
    Message
  </button>

  <p>
    <a id="followersLink">
      Followers:
      <span id="followersCount">0</span>
    </a>
  </p>

  <p>
    <a id="followingLink">
      Following:
      <span id="followingCount">0</span>
    </a>
  </p>

  <p>
    Posts:
    <span id="postCount">0</span>
  </p>

  <p id="userBio">
    Loading...
  </p>

  <p id="joinDate">
    Member since: Loading...
  </p>

  <h3>User Posts</h3>

  <div id="userPosts">
    Loading posts...
  </div>
</div>
  
<script type="module"
src="user.js"></script>
  <script type="module" src="theme.js"></script>
  
</body>
</html>
