<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<title>User Profile</title>
  <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="user.css">
</head>
<body class="user-page">

<div class="profile-container">
  <h2>User Profile</h2>

  <img
    id="userPhoto"
    src="images/default-avatar.png"
    width="120"
    alt="User Profile Picture"
  >

  <h3 id="userName">
    Loading...
  </h3>

  <button id="followBtn">
    Follow
  </button>

  <button id="messageBtn">
    Message
  </button>

  <p>
    <a id="followersLink">
      Followers:
      <span id="followersCount">0</span>
    </a>
  </p>

  <p>
    <a id="followingLink">
      Following:
      <span id="followingCount">0</span>
    </a>
  </p>

  <p>
    Posts:
    <span id="postCount">0</span>
  </p>

  <p id="userBio">
    Loading...
  </p>

  <p id="joinDate">
    Member since: Loading...
  </p>

  <h3>User Posts</h3>

  <div id="userPosts">
    Loading posts...
  </div>
</div>
  
  <div id="navbar-container"></div>

<script>
fetch("navbar.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("navbar-container").innerHTML = data;
  });
</script>

<script type="module"
src="user.js"></script>
  
</body>
</html>
