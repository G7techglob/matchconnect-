<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<title>User Profile</title>
  
    <link rel="stylesheet" href="user.css">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="user-menu.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="user-page">

<div class="profile-container">  <h2>User Profile</h2>  <div id="userMenuContainer"></div>  <section class="profile-info" aria-label="Profile information"><!-- Followers + Profile Photo + Following -->
<div class="profile-main-row">

  <div class="follow-side follow-left">
    <a id="followersLink" href="#" aria-label="View followers list">
      <span class="follow-label">Followers</span>
      <span id="followersCount">0</span>
    </a>
  </div>

  <img
    id="userPhoto"
    src="images/default-avatar.png"
    width="120"
    height="120"
    alt="User Profile Picture"
  >

  <div class="follow-side follow-right">
    <a id="followingLink" href="#" aria-label="View following list">
      <span class="follow-label">Following</span>
      <span id="followingCount">0</span>
    </a>
  </div>

</div>

<!-- Username -->
<h3 id="userName">
  Loading...
</h3>

<!-- Follow + Message -->
<div class="user-action-buttons">

  <button id="followBtn">
    Follow
  </button>

  <button id="messageBtn">
    Message
  </button>

</div>

<!-- Bio -->
<p id="userBio">
  Loading...
</p>

<!-- Join Date -->
<p id="joinDate">
  Member since: Loading...
</p>

<!-- Post Count -->
<section id="profileStats" aria-label="Profile statistics">
  <p>
    Posts:
    <span id="postCount">0</span>
  </p>
</section>

<!-- Profile Tabs -->
<section class="profile-tabs">

  <button id="userPostsTab">
    Posts
  </button>

  <button id="userPhotosTab">
    Photos
  </button>

  <button id="userReelsTab">
    Reels
  </button>

</section>

<!-- User Posts -->
<h3>User Posts</h3>

<div id="userPosts">
  Loading posts...
</div>

  </section>
</div>
  

<script type="module" src="user.js"></script>
  <script type="module" src="user-menu.js"></script>
<script type="module" src="theme.js"></script>
  
</body>
</html>
