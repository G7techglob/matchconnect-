<section class="create-post" aria-labelledby="createPostTitle">

  <h3 id="createPostTitle">Create Post</h3>

  <div class="post-text-area">

    <label for="postContent" class="sr-only">

    <textarea
      id="postContent"
      placeholder="What's on your mind?"
      rows="4"
      maxlength="500"
    ></textarea>

    <button
      id="createPostBtn"
      class="create-post-btn"
      type="button"
      aria-label="Select photos or videos"
    >🔘</button>

  </div>

  <input
    type="file"
    id="mediaPostInput"
    accept="image/*,video/*"
    multiple
    hidden
  >

  <button id="postBtn" type="button">
  Post
  </button>

</section>
