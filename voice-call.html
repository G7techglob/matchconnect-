<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Voice Call - MatchConnect</title>

    <link
        rel="stylesheet"
        href="voice-call.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>


    <!-- =====================================================
         VOICE CALL HEADER
    ====================================================== -->

    <header class="call-header">

        <button
            id="backBtn"
            class="back-btn"
            type="button"
        >

            <i class="fa-solid fa-arrow-left"></i>

        </button>


        <div class="caller-info">

            <img
                id="callerPhoto"
                src="images/default-avatar.png"
                alt="User"
            >


            <div>

                <h3 id="callerName">
                    Calling...
                </h3>

                <p id="callStatus">
                    Connecting...
                </p>

            </div>

        </div>

    </header>



    <!-- =====================================================
         VOICE CALL AREA
    ====================================================== -->

    <main
        id="videoContainer"
        class="video-container"
    >

        <div
            id="voiceAvatar"
            class="voice-avatar"
        >

            <img
                id="voiceAvatarPhoto"
                src="images/default-avatar.png"
                alt="User"
            >


            <h2 id="voiceAvatarName">
                Calling...
            </h2>

        </div>


        <!-- Hidden audio element for remote voice -->

        <audio
            id="remoteAudio"
            autoplay
        ></audio>

    </main>



    <!-- =====================================================
         VOICE CALL CONTROLS
    ====================================================== -->

    <div class="call-controls">


        <!-- MICROPHONE -->

        <button
            id="muteBtn"
            class="call-control"
            type="button"
            title="Mute microphone"
        >

            <i class="fa-solid fa-microphone"></i>

        </button>



        <!-- END CALL -->

        <button
            id="endCallBtn"
            class="end-call-btn"
            type="button"
            title="End call"
        >

            <i class="fa-solid fa-phone-slash"></i>

        </button>


    </div>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        type="module"
        src="voice-call.js"
    ></script>


</body>

</html>
