<!DOCTYPE html>
<html>
<head>
  <title>MatchConnect</title>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCVdy9nJLp3YDV9PNB9kfR3HiQCdFdvGmg",
      authDomain: "matchconnect-44a3e.firebaseapp.com",
      projectId: "matchconnect-44a3e",
      storageBucket: "matchconnect-44a3e.firebasestorage.app",
      messagingSenderId: "283382943870",
      appId: "1:283382943870:web:ee1d08c65bcbac400cc82f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // MAKE BUTTON WORK HERE
    window.createUser = async function () {
      try {
        const docRef = await addDoc(collection(db, "users"), {
          name: "Mira",
          age: 22,
          city: "Tripoli",
          bio: "Hello",
          createdAt: new Date()
        });

        console.log("User created:", docRef.id);
        alert("User created!");
      } catch (e) {
        console.error(e);
        alert("Error creating user");
      }
    };
  </script>
</head>

<body>

  <h1>MatchConnect</h1>

  <button onclick="createUser()">Create User</button>

</body>
</html>
