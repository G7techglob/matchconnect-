<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MatchConnect Dashboard</title>

  <link rel="stylesheet" href="css/index.css" />
</head>
<body>

  <div class="dashboard">

    <header>
      <h1>MatchConnect Dashboard</h1>
      <p>Fun • Hookup • Matchmaking Platform</p>

      <div class="header-buttons">
        <button>Upload Photo</button>
        <button>Upload Video</button>
      </div>
    </header>

    <section class="stats">

      <div class="card">
        <h2>Active Members</h2>
        <p>12.4K</p>
      </div>

      <div class="card">
        <h2>New Matches</h2>
        <p>1,280</p>
      </div>

      <div class="card">
        <h2>Video Uploads</h2>
        <p>845</p>
      </div>

    </section>

    <section>
      <h2 class="title">Featured Profiles</h2>

      <div class="profiles" id="profiles"></div>
    </section>

    <section class="activities">
      <h2>Recent Activities</h2>

      <div class="activity">Sophia uploaded a new video</div>
      <div class="activity">Daniel matched with Amara</div>
      <div class="activity">5 new photos added today</div>
    </section>

  </div>

  <script src="js/index.js"></script>

</body>
</html>
