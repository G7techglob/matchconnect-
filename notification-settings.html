<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notification Settings - MatchConnect</title>

<link rel="stylesheet" href="notification-settings.css">

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>


<body>


<div class="container">


<header class="header">


<button id="backBtn" class="icon-btn">

<span class="material-icons">
arrow_back
</span>

</button>


<h2>
Notification Settings
</h2>


<div style="width:40px;"></div>


</header>





<div class="card">



<div class="notification-item">

<div>

<span class="title">
Likes
</span>

<p>
Notify me when someone likes my post
</p>

</div>


<label class="switch">

<input type="checkbox" id="likesNotification" checked>

<span class="slider"></span>

</label>


</div>





<div class="notification-item">

<div>

<span class="title">
Comments
</span>

<p>
Notify me when someone comments
</p>

</div>


<label class="switch">

<input type="checkbox" id="commentsNotification" checked>

<span class="slider"></span>

</label>


</div>






<div class="notification-item">

<div>

<span class="title">
Messages
</span>

<p>
Notify me when I receive messages
</p>

</div>


<label class="switch">

<input type="checkbox" id="messagesNotification" checked>

<span class="slider"></span>

</label>


</div>






<div class="notification-item">

<div>

<span class="title">
Followers
</span>

<p>
Notify me when someone follows me
</p>

</div>


<label class="switch">

<input type="checkbox" id="followersNotification" checked>

<span class="slider"></span>

</label>


</div>




</div>


</div>


<script type="module" src="notification-settings.js"></script>


</body>

</html>
